name: Demo CI

on:
  push:
    branches: [ demo-vulns ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show demo env
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "Running demo job"
          # Printing secrets is insecure — left here for demo if you set a fake secret
          echo "DEMO_TOKEN=${DEMO_TOKEN}"
